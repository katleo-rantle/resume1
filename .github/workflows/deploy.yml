## Deploy static portfolio to S3 and invalidate CloudFront
# Auth: GitHub OIDC → IAM role (no access keys)

name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:          # optional: Run workflow button in GitHub UI

permissions:
  id-token: write             # required for OIDC
  contents: read              # checkout the repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate projects.json
        run: python3 -m json.tool projects.json > /dev/null

      # OIDC: temporary credentials from the IAM role
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync . "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md" \
            --exclude ".gitignore" \
            --cache-control "public, max-age=300"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" Deploy static portfolio to S3 and invalidate CloudFront
